<!DOCTYPE html>
<html lang="en">
    <head>    
        <meta charset="UTF-8">    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Report an Item - Campus Lost and Found</title> 

    <link rel="stylesheet" href="style.css">
    </head>
<body>  

<header>        
    <h1>Campus Lost and Found System</h1>        
    <p style="font-style: italic;"> A lost or found item.</p>   
</header>     
  <nav>       
    <a href="index.html">Home</a>        
    <a href="report.html">Report an Item</a>    
  </nav>      
<main>        
    <section>            
     <h2>Report an Item</h2>           
       <p>Please complete the form below.</p> 
        <form id="reportForm" action="process.php" method="post">  
                                   
<div>                    
    <label for="fullName">Full Name:</label>                   
    <input type="text" id="fullName" name="full_name" required>                
</div>                <br>               
<div>                    
    <label for="email">Email Address:</label>                    
    <input type="email" id="email" name="email" required>                
</div>                
<br>                   
    <fieldset>                    
        <legend>Report Type:</legend>                    
        <input type="radio" id="lost" name="report_type" value="Lost" required>                    
        <label for="lost">Lost</label>                    
        <input type="radio" id="found" name="report_type" value="Found">                    
        <label for="found">Found</label>                    
           
    <p id="reportTypeMessage" aria-live="polite"></p>                
    </fieldset>                
        <br>                
    <div>                    
            <label for="itemName">Item Name:</label>                    
            <input type="text" id="itemName" name="item_name" required>                           
         <p>Preview: <span id="itemPreview">No item entered</span></p>                
        </div>                
        <br>                
<div>                    
    <label for="category">Category:</label>                    
    <select id="category" name="category" required>                        
        <option value="">Select a category</option>                        
                
            <option value="Electronics">Electronics</option>                        
            <option value="Documents">Documents</option>                        
            <option value="Clothing">Clothing</option>                        
            <option value="Accessories">Accessories</option>                        
            <option value="Other">Other</option>                   
    </select> 
    <div id="otherCategoryBox" style="display:none;">
    <label for="otherCategory">Specify Category:</label>
    <input type="text" id="otherCategory" name="other_category">
</div>          
<br              
<div>                  
    <label for="location">Location:</label>                    
    <input type="text" id="location" name="location" required>               
</div>                
<br>             
<form>                 
                            
    <label for="itemDate">Date Lost or Found:</label>                    
                            
    <input type="date" id="itemDate" name="item_date" required>                
</div>                <br> 
               
<div>    
    <label for="description">Item Description:</label>    
<br>    
    <textarea
    id="description"
    name="description"
    rows="5"
    maxlength="300"
    required>
</textarea>   
    
        <p>        <span id="characterCount">0</span>/300 characters    </p>
</div>  
                
      <div id="formMessage" class="message" aria-live="polite"></div>           
    <br>             
 <button type="submit">Submit Report</button>            
</form>        
</section>    
</main> 

<!-- Footer -->    
 <footer>        
    <p>2026 Campus Lost and Found System</p>    
</footer>    
 <script src="script.js"></script>
</body>
</html>
